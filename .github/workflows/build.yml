name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "web-build/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk reshimarket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reshimarket-apk
          path: reshimarket.apk
          retention-days: 90

      # קישור הורדה ישיר וקבוע ל-APK האחרון:
      # https://github.com/miriamvoronov-spec/ReahimatKniotttt/releases/latest/download/reshimarket.apk
      - name: Publish latest APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest reshimarket.apk \
            --title "רשימרקט – גרסה אחרונה" \
            --notes "נבנה אוטומטית מ-main (${GITHUB_SHA::7}). להורדה בטלפון: לוחצים על reshimarket.apk." \
            --target "$GITHUB_SHA" --latest
