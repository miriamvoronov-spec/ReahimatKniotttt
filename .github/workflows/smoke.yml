name: Smoke test
on:
  push:
    branches: ["claude/**"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.reshimarket.app/com.reshimarket.ui.MainActivity
            sleep 20
            adb shell input tap 540 1400 || true
            sleep 5
            adb shell pidof com.reshimarket.app && echo APP_ALIVE || echo APP_DEAD
            adb logcat -d -b crash
            adb logcat -d | grep -E "AndroidRuntime|FATAL|reshimarket" | tail -80 || true
            adb exec-out screencap -p > shot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shot, path: shot.png }
