<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רשימרקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, playful supermarket abundance
   IDEA a shopping app that feels like a colourful market shelf, cart at hand
   PICTURE the live list itself: red/green product rows, emojis flying into the cart
   COLOUR warm peach-pink gradient ground, tomato red, leaf green, sunny yellow
   TYPE Rubik 800 display + Rubik text
   LAYOUT one app column up to 560px; header, tabs, summary card, tools, categories; cart floats at the side */
:root{color-scheme:light dark;--bg:light-dark(#fff8ee,#1c1620);--ink:light-dark(#2a1a10,#f7ede6);--mut:light-dark(#7a6252,#b9a7a0);--card:light-dark(#fffdfa,#241c28);--line:light-dark(#efdfcc,#3a2f3e);--red:light-dark(#d93a3f,#ff7477);--redbg:light-dark(#ffe4e1,#3b1f25);--grn:light-dark(#178a4a,#55d68f);--grnbg:light-dark(#dcf4e3,#15301f);--sun:#ffb703;--g1:light-dark(#fff8ee,#1c1620);--g2:light-dark(#fff8ee,#1c1620);--fs:16px;--pat:none}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font:400 var(--fs)/1.45 'Rubik',system-ui,sans-serif;background-color:var(--bg);background-image:var(--pat),linear-gradient(165deg,var(--g1),var(--g2));background-attachment:fixed;background-repeat:repeat;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 140px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:62px;height:62px;flex:none}
h1{margin:0;font-weight:800;font-size:32px;color:light-dark(#8a4b17,#f2b46d);line-height:1.05;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tb{display:flex;gap:6px}
.ic{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.sum b{font-size:44px;font-weight:800;line-height:1;color:var(--red)}
.sum .ok{color:var(--grn)}
.sum small{display:block;color:var(--mut);font-size:13px}
.sum .ems{font-size:20px;letter-spacing:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchrow input,.sheet input:not([type=color]):not([type=range]):not([type=checkbox]),.sheet select{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.go{background:var(--grn);border-color:var(--grn);color:#fff;margin-inline-start:auto}
.cat{background:var(--card);border-radius:22px;margin-bottom:12px;border:1px solid var(--line);overflow:hidden;transition:box-shadow .2s}
.cat.dragging,.item.dragging{pointer-events:none;position:relative;z-index:30;box-shadow:0 14px 30px rgba(0,0,0,.22);opacity:.95}
.cat.over-a,.item.over-a{box-shadow:inset 0 -4px 0 var(--sun)}
.cat.over-b,.item.over-b{box-shadow:inset 0 4px 0 var(--sun)}
.ch{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 8px}
.grip{width:32px;height:44px;display:grid;place-items:center;color:var(--mut);touch-action:none;cursor:grab;flex:none;user-select:none;-webkit-user-select:none;font-size:18px;letter-spacing:-3px}
.cname{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:0;text-align:start;font-size:1.15em}
.cname b{font-weight:800;color:color-mix(in srgb,var(--c) 82%,var(--ink))}
.badge{min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-size:14px;font-weight:700;display:inline-grid;place-items:center}
.chev{margin-inline-start:auto;color:var(--mut);transition:transform .2s}
.cat.shut .chev{transform:rotate(90deg)}
.cat.shut .items,.cat.shut .add{display:none}
.ib{width:38px;height:44px;border:0;background:none;color:var(--mut);border-radius:10px;flex:none;font-size:15px}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.items{padding:0 8px}
.item{display:flex;align-items:center;gap:6px;min-height:54px;padding:4px 4px 4px 2px;margin-bottom:6px;border-radius:16px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .25s}
.item.miss{background:var(--redbg)}
.item.have{background:var(--grnbg)}
.em{font-size:1.7em;width:1.6em;text-align:center;flex:none;display:inline-block}
.nm{flex:1;font-size:1.05em;font-weight:500;overflow-wrap:anywhere}
.nm i{font-style:normal;font-weight:700;color:var(--mut);font-size:.9em}
.item.have .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--grn) 70%,transparent);color:color-mix(in srgb,var(--ink) 65%,transparent)}
.st{flex:none;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.miss .st{background:var(--red);color:#fff}
.have .st{background:var(--grn);color:#fff}
.item.newpop{animation:newpop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes newpop{0%{transform:perspective(500px) rotateX(-95deg) translateY(-18px);opacity:0}60%{transform:perspective(500px) rotateX(14deg);opacity:1}100%{transform:none}}
.item.flash{animation:flash .9s 2}
@keyframes flash{50%{background:color-mix(in srgb,var(--sun) 55%,transparent)}}
.add{display:flex;gap:6px;padding:4px 8px 10px}
.add input{flex:1;height:46px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;padding:0 12px;font-size:16px}
.add button{width:46px;height:46px;border-radius:14px;border:0;background:color-mix(in srgb,var(--c) 18%,var(--card));font-size:20px;font-weight:700}
.add button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.addcat{width:100%;height:52px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:color-mix(in srgb,var(--card) 60%,transparent);font-weight:700;font-size:16px}
.note{color:var(--mut);font-size:13px;text-align:center;margin:14px 0}
.empty{padding:6px 12px 12px;color:var(--mut);font-size:14px}
#cart{position:fixed;left:max(16px,calc(50vw - 330px));bottom:24px;z-index:25;width:72px;height:72px;border-radius:24px;border:0;background:var(--sun);color:#2a1a10;box-shadow:0 10px 24px rgba(120,60,0,.3);display:grid;place-items:center}
#cart svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#cc{position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;border-radius:999px;background:var(--grn);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 6px;border:3px solid var(--sun)}
#cart.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18) rotate(-6deg)}}
.flyer{position:fixed;left:0;top:0;width:40px;height:40px;font-size:32px;line-height:40px;text-align:center;z-index:60;pointer-events:none}
.sw{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.45);display:none;align-items:flex-end;justify-content:center}
.sw.open{display:flex}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px 28px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:22px;font-weight:800}
.sheet label{display:block;margin:10px 0;font-weight:500;font-size:15px}
.sheet label>input,.sheet label>select{margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:700;display:inline-grid;place-items:center;text-decoration:none;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.wa{background:#25a35a;color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{flex:1;height:44px;border:0;background:transparent;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg)}
.sheet pre{white-space:pre-wrap;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:14px;padding:12px;font:15px/1.5 'Rubik',sans-serif;max-height:36vh;overflow:auto}
.sw .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--grn)}
input[type=color]{width:56px;height:44px;border:1px solid var(--line);border-radius:12px;background:none;padding:3px}
input[type=range]{width:100%;accent-color:var(--red)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:20px}
.qty b{min-width:2ch;text-align:center;font-size:20px}
.crow{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border:0;border-radius:14px;background:var(--redbg);text-align:start;font-size:16px;min-height:52px;transition:background .2s}
.crow.in{background:var(--grnbg)}
.crow.in span:nth-child(2){text-decoration:line-through;opacity:.7}
.crow .st{background:var(--red);color:#fff}
.crow.pick{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.crow.pick .st{background:var(--sun);color:#2a1a10}
.embtn{width:60px;height:52px;font-size:30px;border-radius:14px;border:1px solid var(--line);background:transparent}
.pv{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pv small{display:block;color:var(--mut);font-size:14px}
#pv{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:20px;background:color-mix(in srgb,var(--sun) 25%,transparent)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px;max-height:40vh;overflow:auto;padding:2px}
.egrid button{height:50px;font-size:28px;border:0;background:none;border-radius:12px}
.egrid button.on{background:color-mix(in srgb,var(--sun) 45%,transparent);outline:2px solid var(--sun)}
.crow.in .st{background:var(--grn)}
.crow .em{font-size:26px}
.crow span:nth-child(2){flex:1}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:var(--sun);font-weight:800;min-height:36px}
#doors{position:fixed;inset:0;z-index:55;pointer-events:none;display:flex}
#doors i{flex:1;background:linear-gradient(110deg,rgba(190,230,255,.75),rgba(140,200,240,.55));border:10px solid #8a96a3;transition:transform .7s cubic-bezier(.6,0,.3,1);position:relative}
#doors i:first-child{transform:translateX(105%)}
#doors i:last-child{transform:translateX(-105%)}
#doors i::after{content:"";position:absolute;top:45%;width:10px;height:70px;border-radius:6px;background:#5d6773}
#doors i:first-child::after{left:12px}
#doors i:last-child::after{right:12px}
#doors.shut i{transform:none}
#receipt{position:fixed;z-index:65;left:50%;bottom:0;width:min(330px,calc(100vw - 32px));transform:translate(-50%,110%);transition:transform 1.1s steps(9,end);background:#fffef8;color:#2a1a10;padding:20px 20px 30px;font:15px/1.5 'Rubik',sans-serif;border-radius:4px 4px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#receipt.show{transform:translate(-50%,0)}
#receipt h4{margin:0;text-align:center;font-size:22px;font-weight:800}
#receipt .ln{border-top:2px dashed #cbb;margin:10px 0}
#receipt .tot{font-size:20px;font-weight:800;text-align:center}
#receipt ul{list-style:none;padding:0;margin:0;max-height:30vh;overflow:auto}
#receipt li{display:flex;justify-content:space-between}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:66;pointer-events:none;border-radius:2px}
@media(max-width:400px){h1{font-size:28px}.brand svg{width:50px;height:50px}.st{font-size:12px;padding:3px 8px}.ib{width:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand">
  <svg viewBox="0 0 200 200" role="img" aria-label="הלוגו של רשימרקט: סל קש מלא מוצרים">
   <rect x="52" y="30" width="20" height="76" rx="10" transform="rotate(-20 62 68)" fill="#e2a452"/>
   <path d="M50 44 l14 5 M47 56 l14 5 M44 68 l14 5" stroke="#b97a2e" stroke-width="3" stroke-linecap="round"/>
   <path d="M118 54 L130 40 L142 54 V96 H118 Z" fill="#fff" stroke="#2a7de1" stroke-width="4" stroke-linejoin="round"/>
   <rect x="122" y="64" width="16" height="10" rx="2" fill="#2a7de1"/>
   <path d="M98 96 C94 62 120 50 134 58 C136 82 122 96 98 96 Z" fill="#7bd389"/>
   <circle cx="86" cy="88" r="20" fill="#e63946"/>
   <path d="M78 70 l8 6 8 -6" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="150" cy="92" r="17" fill="#fb8500"/>
   <path d="M150 75 c4 -6 10 -6 12 -4" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
   <path d="M54 100 L80 84 L86 100 Z" fill="#ffd23f"/>
   <path d="M34 98 H170 L156 168 Q154 178 144 178 H60 Q50 178 48 168 Z" fill="#c07a3a"/>
   <rect x="26" y="90" width="152" height="16" rx="8" fill="#a5612a"/>
   <path d="M44 128 H160 M50 152 H154" stroke="#e3a467" stroke-width="4" stroke-linecap="round"/>
   <path d="M74 108 V174 M102 108 V178 M128 108 V178 M152 108 V170" stroke="#a5612a" stroke-width="3" stroke-linecap="round"/>
   <rect x="78" y="124" width="48" height="32" rx="9" fill="#fff"/>
   <path d="M91 140 l7 7 14 -15" fill="none" stroke="#178a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div><h1>רשימרקט</h1><p>הסופר שלך בכיס</p></div>
 </div>
 <div class="tb">
  <button class="ic" data-act="share" aria-label="שיתוף"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg></button>
  <button class="ic" data-act="settings" aria-label="הגדרות"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
 </div>
</header>
<nav id="tabs" class="tabs"></nav>
<div id="summary"></div>
<div id="searchrow" class="searchrow"><input id="q" type="search" placeholder="חיפוש מוצר בכל הקטגוריות" aria-label="חיפוש"></div>
<div id="actions" class="actions">
 <button id="only" class="chip" data-act="only">רק מה שחסר</button>
 <button class="chip go" data-act="finish">סיימתי קנייה</button>
</div>
<main id="cats"></main>
<button class="addcat" data-act="addcat">＋ קטגוריה חדשה</button>
<p class="note">דמו עם נתוני דוגמה. השינויים נשמרים רק בדפדפן הזה.</p>
</div>
<button id="cart" data-act="cart" aria-label="העגלה"><svg viewBox="0 0 40 40"><path d="M3 6h5l4 20h20l4-14H10"/><circle cx="15" cy="33" r="2.6"/><circle cx="29" cy="33" r="2.6"/></svg><span id="cc">0</span></button>
<div id="sw" class="sw"><div class="sheet" id="sheet"></div></div>
<div id="toast"><span id="tt"></span><button id="tu" hidden>ביטול</button></div>
<div id="doors"><i></i><i></i></div>
<div id="receipt"></div>
<datalist id="sugg"></datalist>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=Date.now();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function fly(txt,a,b,cb){if(reduce){cb&&cb();return}
 const e=document.createElement('span');e.className='flyer';e.textContent=txt;document.body.append(e);
 const ax=a.left+a.width/2-20,ay=a.top+a.height/2-20,bx=b.left+b.width/2-20,by=b.top+b.height/2-20,k=[];
 for(let i=0;i<=14;i++){const t=i/14,s=Math.sin(Math.PI*t);k.push({transform:`translate(${ax+(bx-ax)*t}px,${ay+(by-ay)*t-s*150}px) perspective(300px) rotateY(${t*540}deg) rotateX(${s*35}deg) scale(${1+s*.9-(t>.85?(t-.85)*3:0)})`})}
 e.animate(k,{duration:780,easing:'cubic-bezier(.35,.1,.35,1)'}).onfinish=()=>{e.remove();cb&&cb()}}

 if(!it.have){it.have=true;it.inCart=true;save();render();fly(it.emoji,r,$('#cart').getBoundingClientRect(),bump);tone(420,980,.75,.18)}
 else{it.have=false;it.inCart=false;save();render();const t=document.querySelector(`.item[data-id="${id}"] .em`);
  if(t){t.style.visibility='hidden';fly(it.emoji,$('#cart').getBoundingClientRect(),t.getBoundingClientRect(),()=>{t.style.visibility=''});tone(820,330,.6,.18)}}}

const embtn=(act,e)=>`<div class="row"><span>אימוג׳י</span><button class="embtn" data-act="${act}" aria-label="בחירת אימוג׳י">${esc(e)}</button><small style="color:var(--mut)">לחיצה לבחירה</small></div>`;
function itemSheet(id,d){const f=findItem(id);if(!f)return;const it=f.it;d=d||{name:it.name,emoji:it.emoji,qty:it.qty,cat:f.c.id};menu={id,d};
 openSheet(`<h3>${esc(d.emoji)} ${esc(it.name)}</h3><label>שם<input id="f-name" value="${esc(d.name)}"></label>${embtn('itemem',d.emoji)}<div class="row"><span>כמות</span><div class="qty"><button data-act="qty" data-d="-1" aria-label="פחות">−</button><b id="f-q">${d.qty}</b><button data-act="qty" data-d="1" aria-label="יותר">＋</button></div></div><label>קטגוריה<select id="f-cat">${L().cats.map(c=>`<option value="${c.id}"${c.id===d.cat?' selected':''}>${esc(c.emoji+' '+c.name)}</option>`).join('')}</select></label><div class="row"><button class="btn" data-act="saveitem">שמירה</button><button class="btn danger" data-act="delitem">מחיקה</button><button class="btn ghost" data-act="close">סגירה</button></div>`)}
function readItem(){const d=menu.d;d.name=$('#f-name').value;d.qty=+$('#f-q').textContent;d.cat=$('#f-cat').value;return d}
function catSheet(ci,d){const c=ci==null?null:L().cats[ci];d=d||{name:c?c.name:'',color:c?c.color:'#e85d04',emoji:c?c.emoji:''};menu={ci,d};
 openSheet(`<h3>${c?'עריכת קטגוריה':'קטגוריה חדשה'}</h3><label>שם<input id="c-name" value="${esc(d.name)}" placeholder="למשל: קפואים"></label><div class="row"><span>צבע הכותרת</span><input type="color" id="c-col" value="${esc(d.color)}" aria-label="צבע"></div>${embtn('catem',d.emoji||catEmoji(d.name||''))}<div class="row"><button class="btn" data-act="savecat">שמירה</button>${c?'<button class="btn danger" data-act="delcat">מחיקת קטגוריה</button>':''}<button class="btn ghost" data-act="close">סגירה</button></div>`);
 if(!c)setTimeout(()=>$('#c-name')?.focus(),50)}
function readCat(){const d=menu.d;d.name=$('#c-name').value;d.color=$('#c-col').value;return d}
function listSheet(isNew,d){const l=L();d=d||{name:isNew?'':l.name,emoji:isNew?'':(l.emoji||listEmoji(l.name))};menu={isNew,d};
 openSheet(`<h3>${isNew?'רשימה חדשה':'עריכת הרשימה'}</h3><label>שם<input id="l-name" value="${esc(d.name)}" placeholder="למשל: שוק"></label>${embtn('listem',d.emoji||listEmoji(d.name||''))}<div class="row"><button class="btn" data-act="savelist">${isNew?'יצירה':'שמירה'}</button>${isNew?'':'<button class="btn danger" data-act="dellist">מחיקת הרשימה</button>'}<button class="btn ghost" data-act="close">סגירה</button></div>`)}
function emMgr(t){menu={emt:t};const l=L();let rows;
 if(t==='list')rows=st.lists.map(x=>({id:x.id,e:x.emoji||listEmoji(x.name),n:x.name,u:false}));
 else if(t==='cat')rows=l.cats.map(c=>({id:c.id,e:c.emoji,n:c.name,u:c.emoji==='🧺'}));
 else rows=l.cats.flatMap(c=>c.items.map(x=>({id:x.id,e:x.emoji,n:x.name,u:x.emoji==='🛒'}))).sort((a,b)=>b.u-a.u);
 openSheet(`<h3>שינוי אימוג׳ים</h3><p style="margin:-4px 0 8px;color:var(--mut)">למה רוצים לבחור אימוג׳י?</p><div class="seg">${[['list','רשימה'],['cat','קטגוריה'],['item','מוצר']].map(([k,n])=>`<button class="${k===t?'on':''}" data-act="emt" data-t="${k}">${n}</button>`).join('')}</div><div style="margin-top:12px">${rows.map(r=>`<button class="crow pick" data-act="emtarget" data-id="${r.id}"><span class="em">${esc(r.e)}</span><span>${esc(r.n)}</span>${r.u?'<span class="st">לא זוהה</span>':'<span style="color:var(--mut)">שינוי ›</span>'}</button>`).join('')||'<p>אין כאן עדיין כלום</p>'}</div><div class="row"><button class="btn ghost" data-act="settings">חזרה להגדרות</button><button class="btn" data-act="close">סגירה</button></div>`)}
function shareText(){const l=L();let s=`🛒 רשימרקט · ${l.name}\n`;for(const c of l.cats){const its=c.items.filter(x=>shareMode==='all'||!x.have);if(!its.length)continue;s+=`\n${c.emoji} ${c.name}\n`+its.map(x=>`${shareMode==='all'?(x.have?'🟢 ':'🔴 '):'• '}${x.emoji} ${x.name}${x.qty>1?' ×'+x.qty:''}`).join('\n')+'\n'}return s}
function shareSheet(){const t=shareText();openSheet(`<h3>שיתוף לוואטסאפ</h3><div class="seg"><button class="${shareMode==='miss'?'on':''}" data-act="shm" data-m="miss">רק מה שחסר</button><button class="${shareMode==='all'?'on':''}" data-act="shm" data-m="all">הכל</button></div><pre>${esc(t)}</pre><div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">פתיחה בוואטסאפ</a><button class="btn ghost" data-act="copy">העתקה</button><button class="btn ghost" data-act="close">סגירה</button></div>`)}
function cartSheet(){const l=L();const its=l.cats.flatMap(c=>c.items).filter(x=>!x.have||x.inCart);
 openSheet(`<h3>העגלה שלי</h3><p style="margin:-6px 0 8px;color:var(--mut);font-size:14px">לחיצה על מוצר מסמנת ״קניתי״, ולחיצה נוספת מחזירה אותו לרשימה כחסר</p>${its.map(x=>`<button class="crow${x.inCart?' in':''}" data-act="ctog" data-id="${x.id}"><span class="em">${esc(x.emoji)}</span><span>${esc(x.name)}${x.qty>1?' ×'+x.qty:''}</span><span class="st">${x.inCart?'✓ קניתי':'עוד לא'}</span></button>`).join('')||'<p>העגלה ריקה. כשמסמנים מוצר כ״קניתי״ הוא קופץ לכאן.</p>'}<div class="row"><button class="btn" data-act="close">סגירה</button></div>`)}
function setSheet(){const s=st.set;openSheet(`<h3>הגדרות</h3><label>מצב תצוגה</label><div class="seg">${[['auto','אוטומטי'],['day','יום'],['night','לילה']].map(([k,n])=>`<button class="${s.mode===k?'on':''}" data-act="mode" data-m="${k}">${n}</button>`).join('')}</div><label for="s-fs">גודל כתב: <b id="s-fv">${s.fs}</b></label><input type="range" id="s-fs" min="14" max="24" value="${s.fs}"><label>רקע בגרדיאנט</label><div class="row"><span>למעלה</span><input type="color" id="s-g1" value="${s.g1||'#fff8ee'}" aria-label="צבע עליון"><span>למטה</span><input type="color" id="s-g2" value="${s.g2||'#fff8ee'}" aria-label="צבע תחתון"><button class="btn ghost" data-act="resetbg">ברירת מחדל</button></div><div class="toggle"><span>מדפי סופר ברקע</span><input type="checkbox" id="s-pat"${s.pat?' checked':''}></div><button class="crow pick" data-act="emmgr" style="margin-top:10px"><span class="em">😀</span><span><strong>אימוג׳ים</strong><br><small style="color:var(--mut)">בחירה ושינוי לרשימות, קטגוריות ומוצרים</small></span><span style="color:var(--mut)">›</span></button><div class="toggle"><span>צלילים</span><input type="checkbox" id="s-snd"${s.snd?' checked':''}></div><label style="margin-top:16px">מה יופיע במסך הבית</label><div class="toggle"><span>כרטיס סיכום החסרים</span><input type="checkbox" id="h-sum"${s.home.sum?' checked':''}></div><div class="toggle"><span>שורת חיפוש</span><input type="checkbox" id="h-search"${s.home.search?' checked':''}></div><div class="toggle"><span>כפתורי ״רק מה שחסר״ ו״סיימתי״</span><input type="checkbox" id="h-actions"${s.home.actions?' checked':''}></div><div class="row"><button class="btn" data-act="close">סיום</button></div>`)}
$('#sheet').addEventListener('input',e=>{const s=st.set,id=e.target.id;
 if(id==='s-fs'){s.fs=+e.target.value;$('#s-fv').textContent=s.fs}
 else if(id==='s-g1'||id==='s-g2'){s.g1=$('#s-g1').value;s.g2=$('#s-g2').value}
 else if(id==='s-pat')s.pat=e.target.checked;else if(id==='s-snd')s.snd=e.target.checked;
 else if(id.startsWith('h-'))s.home[id.slice(2)]=e.target.checked;else return;
 applySet();save()});

function confetti(){if(reduce)return;const cols=['#ff5a5f','#ffb703','#1f9d55','#2a7de1','#ff8fab','#fb8500'];for(let i=0;i<90;i++){const d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];document.body.append(d);d.animate([{transform:'translateY(0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*200}px,${innerHeight+40}px) rotate(${Math.random()*900}deg)`}],{duration:1600+Math.random()*1400,delay:Math.random()*400,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove()}}
let drive=null;
function finish(){const l=L(),got=[];
 for(const c of l.cats)for(const x of c.items){if(!x.have||x.inCart)got.push(x);x.have=true;x.inCart=false}
 if(!got.length){toast('אין מה לסיים, הכל כבר בבית');return}
 ac();save();render();confetti();[523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,i*.12,.25));
 drive=$('#cart').animate([{transform:'none'},{transform:'translateX(-12px) rotate(3deg)',offset:.2},{transform:'translateX(-130vw) rotate(-3deg)'}],{duration:reduce?1:1100,easing:'ease-in',fill:'forwards'});
 setTimeout(()=>$('#doors').classList.add('shut'),900);
 setTimeout(()=>{const r=$('#receipt');const d=new Date();r.innerHTML=`<h4>רשימרקט</h4><div style="text-align:center;font-size:13px">${esc(l.name)} · ${d.toLocaleDateString('he-IL')} ${d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div><div class="ln"></div><ul>${got.map(x=>`<li><span>${esc(x.emoji)} ${esc(x.name)}</span><span>${x.qty>1?'×'+x.qty:'✓'}</span></li>`).join('')}</ul><div class="ln"></div><div class="tot">קנית ${got.length} מוצרים 🎉</div><div class="row" style="justify-content:center"><button class="btn" data-act="closercpt">תודה, להתראות</button></div>`;r.classList.add('show')},1600)}
function closeRcpt(){$('#receipt').classList.remove('show');$('#doors').classList.remove('shut');setTimeout(()=>{drive&&drive.cancel();drive=null;bump()},600)}

function addItem(ci,input){const name=norm(input.value);if(!name)return;const l=L();
 for(const c of l.cats){const d=c.items.find(x=>norm(x.name)===name);if(d){toast(`״${name}״ כבר ברשימה, ב${c.name}`);input.value='';if(!c.open){c.open=true;render()}const el=document.querySelector(`.item[data-id="${d.id}"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');el.scrollIntoView({block:'center',behavior:'smooth'})}return}}
 const it=mk(name,false);l.cats[ci].items.push(it);save();render();
 if(it.emoji==='🛒')toast(`לא זיהיתי אימוג׳י ל״${name}״`,()=>setTimeout(()=>openPicker('מוצר ״'+name+'״',it.emoji,e=>{it.emoji=e;save();render()},closeSheet),0),'לבחירה');
 document.querySelector(`.item[data-id="${it.id}"]`)?.classList.add('newpop');
 document.querySelector(`.add[data-ci="${ci}"] input`)?.focus()}

document.addEventListener('submit',e=>{const f=e.target.closest('.add');if(!f)return;e.preventDefault();addItem(+f.dataset.ci,f.querySelector('input'))});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b){const it=e.target.closest('.item');if(it&&!e.target.closest('.grip'))toggle(it.dataset.id);return}
 const a=b.dataset.act,l=L(),ci=+b.dataset.ci;
 if(a==='fold'){l.cats[ci].open=!l.cats[ci].open}
 else if(a==='up'||a==='down'){const j=a==='up'?ci-1:ci+1;if(j<0||j>=l.cats.length)return;[l.cats[ci],l.cats[j]]=[l.cats[j],l.cats[ci]]}
 else if(a==='list'){st.cur=+b.dataset.i}
 else if(a==='addlist'){listSheet(true);return}
 else if(a==='listmenu'){listSheet(false);return}
 else if(a==='listem'){const d=menu.d,isN=menu.isNew;d.name=$('#l-name').value;openPicker('רשימה'+(d.name?' ״'+d.name+'״':''),d.emoji||listEmoji(d.name),e=>{d.emoji=e},()=>listSheet(isN,d));return}
 else if(a==='itemem'){const d=readItem(),id=menu.id;openPicker('מוצר ״'+d.name+'״',d.emoji,e=>{d.emoji=e;d.manual=1},()=>itemSheet(id,d));return}
 else if(a==='catem'){const d=readCat(),ci2=menu.ci;openPicker('קטגוריה'+(d.name?' ״'+d.name+'״':''),d.emoji||catEmoji(d.name),e=>{d.emoji=e},()=>catSheet(ci2,d));return}
 else if(a==='emmgr'){emMgr('item');return}
 else if(a==='emt'){emMgr(b.dataset.t);return}
 else if(a==='emtarget'){const t=menu.emt,id=b.dataset.id;let o,title;if(t==='list'){o=st.lists.find(x=>x.id===id);title='רשימה ״'+o.name+'״';if(!o.emoji)o.emoji=listEmoji(o.name)}else if(t==='cat'){o=l.cats.find(x=>x.id===id);title='קטגוריה ״'+o.name+'״'}else{o=findItem(id).it;title='מוצר ״'+o.name+'״'}openPicker(title,o.emoji,e=>{o.emoji=e;save();render()},()=>emMgr(t));return}
 else if(a==='egrp'){pk.g=+b.dataset.g;drawPicker();return}
 else if(a==='epick'){pk.sel=b.dataset.e;$('#pv').textContent=pk.sel;document.querySelectorAll('.egrid .on').forEach(x=>x.classList.remove('on'));b.classList.add('on');return}
 else if(a==='eok'){const ty=$('#e-typed').value.trim();if(ty)pk.sel=graph(ty)[0];const p=pk;pk.ok(p.sel);p.back();toast(`האימוג׳י עודכן ל-${p.sel}`);return}
 else if(a==='ecancel'){pk.back();return}
 else if(a==='savelist'){const n=norm($('#l-name').value);if(!n)return;const e=menu.d.emoji||listEmoji(n);if(menu.isNew){st.lists.push({id:nid(),name:n,emoji:e,cats:[]});st.cur=st.lists.length-1}else{l.name=n;l.emoji=e}closeSheet()}
 else if(a==='dellist'){if(st.lists.length<2){toast('צריכה להישאר לפחות רשימה אחת');return}confirmBox(`למחוק את הרשימה ״${l.name}״?`,()=>{st.lists.splice(st.cur,1);st.cur=0});return}
 else if(a==='yes'){const f=menu&&menu.confirm;closeSheet();f&&f()}
 else if(a==='close'){closeSheet();return}
 else if(a==='only'){only=!only}
 else if(a==='finish'){finish();return}
 else if(a==='closercpt'){closeRcpt();return}
 else if(a==='cart'){cartSheet();return}
 else if(a==='ctog'){const f=findItem(b.dataset.id);if(!f)return;ac();const it=f.it;if(it.inCart){it.have=false;it.inCart=false;tone(820,330,0,.18);toast(`${it.emoji} ${it.name} חזר לרשימה כחסר`)}else{it.have=true;it.inCart=true;tone(420,980,0,.18);bump()}save();render();cartSheet();return}
 else if(a==='share'){shareSheet();return}
 else if(a==='shm'){shareMode=b.dataset.m;shareSheet();return}
 else if(a==='copy'){navigator.clipboard?.writeText(shareText()).then(()=>toast('הרשימה הועתקה')).catch(()=>toast('לא הצלחתי להעתיק, אפשר לסמן ולהעתיק ידנית'));return}
 else if(a==='settings'){setSheet();return}
 else if(a==='mode'){st.set.mode=b.dataset.m;applySet();save();setSheet();return}
 else if(a==='resetbg'){st.set.g1=st.set.g2=null;applySet();save();setSheet();return}
 else if(a==='mic'){toast('באפליקציה תוכלי פשוט להגיד ״חלב״. בדמו אין גישה למיקרופון');return}
 else if(a==='itemmenu'){itemSheet(b.dataset.id);return}
 else if(a==='qty'){const q2=$('#f-q');q2.textContent=Math.max(1,+q2.textContent+ +b.dataset.d);return}
 else if(a==='saveitem'){const f=findItem(menu.id);if(!f)return;const d=readItem();const n=norm(d.name)||f.it.name;f.it.emoji=(n!==f.it.name&&!d.manual)?emojiFor(n):d.emoji;f.it.name=n;f.it.qty=d.qty;const to=l.cats.find(c=>c.id===d.cat);if(to&&to!==f.c){f.c.items.splice(f.i,1);to.items.push(f.it)}closeSheet()}
 else if(a==='delitem'){const f=findItem(menu.id);if(!f)return;const {c,i,it}=f;c.items.splice(i,1);closeSheet();toast(`״${it.name}״ נמחק`,()=>c.items.splice(i,0,it))}
 else if(a==='catmenu'){catSheet(ci);return}
 else if(a==='addcat'){catSheet(null);return}
 else if(a==='savecat'){const d=readCat();const n=norm(d.name);if(!n)return;const em=d.emoji||catEmoji(n);if(menu.ci==null){l.cats.push({id:nid(),name:n,color:d.color,emoji:em,open:true,items:[]})}else{const c=l.cats[menu.ci];c.emoji=em;c.name=n;c.color=d.color}closeSheet()}
 else if(a==='delcat'){const c=l.cats[menu.ci];confirmBox(`למחוק את ״${c.name}״ ואת ${c.items.length} המוצרים שבה?`,()=>{l.cats.splice(l.cats.indexOf(c),1);save();render()});return}
 save();render()});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});

let drag=null;
function clearOver(){document.querySelectorAll('.over-a,.over-b').forEach(x=>x.classList.remove('over-a','over-b'))}
function target(x,y){const t=document.elementFromPoint(x,y);if(!t)return null;const sel=drag.type==='cat'?'.cat':'.item';let el=t.closest(sel);if(!el&&drag.type==='item'){const c=t.closest('.cat');return c?{cat:c}:null}if(!el||el===drag.el)return null;const r=el.getBoundingClientRect();return{el,after:y>r.top+r.height/2}}
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-drag]');if(!g)return;e.preventDefault();const type=g.dataset.drag,el=g.closest(type==='cat'?'.cat':'.item');drag={type,el,y0:e.clientY,s0:scrollY};el.classList.add('dragging')});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();if(e.clientY<90)scrollBy(0,-10);else if(e.clientY>innerHeight-90)scrollBy(0,10);drag.el.style.transform=`translateY(${e.clientY-drag.y0+scrollY-drag.s0}px)`;clearOver();const t=target(e.clientX,e.clientY);if(t&&t.el)t.el.classList.add(t.after?'over-a':'over-b');drag.t=t},{passive:false});
function endDrag(){if(!drag)return;const d=drag;drag=null;clearOver();d.el.classList.remove('dragging');d.el.style.transform='';const t=d.t,l=L();if(!t){return}
 if(d.type==='cat'){const from=+d.el.dataset.ci,[c]=l.cats.splice(from,1);let to=+t.el.dataset.ci;if(from<to)to--;l.cats.splice(to+(t.after?1:0),0,c)}
 else{const f=findItem(d.el.dataset.id);if(!f)return;f.c.items.splice(f.i,1);let dest;
  if(t.el){dest=l.cats[+t.el.dataset.ci];const j=dest.items.findIndex(x=>x.id===t.el.dataset.id);dest.items.splice(j+(t.after?1:0),0,f.it)}
  else{dest=l.cats[+t.cat.dataset.ci];dest.items.push(f.it);dest.open=true}
  if(dest!==f.c)toast(`${f.it.emoji} עבר ל${dest.name}`)}
 save();render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

$('#sugg').innerHTML=SUG.map(s=>`<option value="${esc(s)}">`).join('');
applySet();render();
}
</script>
