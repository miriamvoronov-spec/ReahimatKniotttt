<title>רשימרקט</title>

<style>
/* VOICE everyday, playful supermarket abundance
   IDEA a shopping app that feels like a colourful market shelf, cart at hand
   PICTURE the live list itself: red/green product rows, emojis flying into the cart
   COLOUR warm peach-pink gradient ground, tomato red, leaf green, sunny yellow
   TYPE Rubik 800 display + Rubik text
   LAYOUT one app column up to 560px; header, tabs, summary card, tools, categories; cart floats at the side */
:root{color-scheme:light;--bg:#fff8ee;--ink:#2a1a10;--mut:#7a6252;--card:#fffdfa;--line:#efdfcc;--red:#d93a3f;--redbg:#ffe4e1;--grn:#178a4a;--grnbg:#dcf4e3;--brand:#8a4b17;--g1:#fff8ee;--g2:#fff8ee;--sun:#ffb703;--fs:16px;--pat:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-mode=day]){--bg:#1c1620;--ink:#f7ede6;--mut:#b9a7a0;--card:#241c28;--line:#3a2f3e;--red:#ff7477;--redbg:#3b1f25;--grn:#55d68f;--grnbg:#15301f;--brand:#f2b46d;--g1:#1c1620;--g2:#1c1620;color-scheme:dark}}
:root[data-theme=dark]:not([data-mode=day]),:root[data-mode=night]{--bg:#1c1620;--ink:#f7ede6;--mut:#b9a7a0;--card:#241c28;--line:#3a2f3e;--red:#ff7477;--redbg:#3b1f25;--grn:#55d68f;--grnbg:#15301f;--brand:#f2b46d;--g1:#1c1620;--g2:#1c1620;color-scheme:dark}
:root[data-ink]{--ink:var(--ink-user)}
*{box-sizing:border-box;min-width:0}
html{height:100%}
body{direction:rtl;margin:0;min-height:100%;color:var(--ink);font:400 var(--fs)/1.45 'Rubik',system-ui,sans-serif;background-color:var(--bg);background-image:var(--pat),linear-gradient(165deg,var(--g1),var(--g2));background-attachment:fixed;background-repeat:repeat;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding-block:0 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 70%,transparent);margin:0 -8px;padding-inline:8px!important;border-radius:0 0 18px 18px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:62px;height:62px;flex:none}
h1{margin:0;font-weight:800;font-size:32px;color:var(--brand);line-height:1.05;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tb{display:flex;gap:6px}
.ic{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.sum b{flex:none;font-size:44px;font-weight:800;line-height:1;color:var(--red)}
.sum .ok{color:var(--grn)}
.sum small{display:block;color:var(--mut);font-size:13px}
.sum .ems{font-size:20px;letter-spacing:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchrow input,.sheet input:not([type=color]):not([type=range]):not([type=checkbox]),.sheet select{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}

.chip.on{background:var(--red);border-color:var(--red);color:#fff}

.miss .st{background:var(--red);color:#fff}

.item.newpop{animation:newpop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes newpop{0%{transform:perspective(500px) rotateX(-95deg) translateY(-18px);opacity:0}60%{transform:perspective(500px) rotateX(14deg);opacity:1}100%{transform:none}}
.item.flash{animation:flash .9s 2}
@keyframes flash{50%{background:color-mix(in srgb,var(--sun) 55%,transparent)}}
.add{display:flex;gap:6px;padding:4px 8px 10px}
.add input{flex:1;height:46px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;padding:0 12px;font-size:16px}
.add button{width:46px;height:46px;border-radius:14px;border:0;background:color-mix(in srgb,var(--c) 18%,var(--card));font-size:20px;font-weight:700}
.add button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.addcat{width:100%;height:52px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:color-mix(in srgb,var(--card) 60%,transparent);font-weight:700;font-size:16px}
.note{color:var(--mut);font-size:13px;text-align:center;margin:14px 0}
.empty{padding:6px 12px 12px;color:var(--mut);font-size:14px}
#cart{position:fixed;left:max(calc(16px + env(safe-area-inset-left,0px)),calc(50vw - 330px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:25;width:72px;height:72px;border-radius:24px;border:0;background:var(--sun);color:#2a1a10;box-shadow:0 10px 24px rgba(120,60,0,.3);display:grid;place-items:center}
#cart svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#cc{position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;border-radius:999px;background:var(--grn);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 6px;border:3px solid var(--sun)}

.sw{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.45);display:none;align-items:flex-end;justify-content:center}

.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease-out}

function fly(txt,a,b,cb,toCart){if(reduce){cb&&cb();return}
 const e=document.createElement('span');e.className='flyer';e.innerHTML=E(txt);document.body.append(e);
 const ax=a.left+a.width/2-20,ay=a.top+a.height/2-20;
 // the landing spot: inside the cart's basket (upper middle of the cart icon), not its centre
 const bx=b.left+b.width*(toCart?.56:.5)-20,by=b.top+b.height*(toCart?.38:.5)-20,k=[];
 const N=18;
 for(let i=0;i<=N;i++){const t=i/N;let x,y,sc,op=1;
  if(toCart){ // arc to a point just above the basket, then drop in and shrink away
   const u=Math.min(t/.8,1),s=Math.sin(Math.PI*u),hx=bx,hy=by-46;
   if(t<=.8){x=ax+(hx-ax)*u;y=ay+(hy-ay)*u-s*150;sc=1+s*.8}
   else{const v=(t-.8)/.2;x=hx;y=hy+46*v*v;sc=1-.7*v;op=1-v*.9}
  }else{ // pop out of the cart and fly back to the row
   const s=Math.sin(Math.PI*t);x=bx+(ax-bx)*t;y=by+(ay-by)*t-s*140;sc=t<.15?.3+t/.15*.7:1+s*.6;op=t<.1?t*10:1}
  // full turns only (720deg) so the emoji is never left mirrored
  k.push({transform:`translate(${x}px,${y}px) perspective(300px) rotateY(${t*720}deg) rotateX(${Math.sin(Math.PI*t)*30}deg) scale(${sc})`,opacity:op})}
 e.animate(k,{duration:820,easing:'cubic-bezier(.35,.1,.35,1)'}).onfinish=()=>{e.remove();cb&&cb()}}
